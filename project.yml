name: SkyScan
options:
  bundleIdPrefix: com.skyscan
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""

targets:
  SkyScan:
    type: application
    platform: macOS
    sources:
      - path: SkyScan
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skyscan.app
        INFOPLIST_FILE: SkyScan/Info.plist
        CODE_SIGN_ENTITLEMENTS: SkyScan/SkyScan.entitlements
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: SkyScanWidget

  SkyScanWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: SkyScanWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skyscan.app.widget
        INFOPLIST_FILE: SkyScanWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: SkyScanWidget/SkyScanWidget.entitlements
        GENERATE_INFOPLIST_FILE: NO

  SkyScan-iOS:
    type: application
    platform: iOS
    sources:
      - path: SkyScan
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skyscan.app
        INFOPLIST_FILE: SkyScan/Info.plist
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: SkyScanWidget-iOS

  SkyScanWidget-iOS:
    type: app-extension
    platform: iOS
    sources:
      - path: SkyScanWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skyscan.app.widget
        INFOPLIST_FILE: SkyScanWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO

schemes:
  SkyScan:
    build:
      targets:
        SkyScan: all
        SkyScanWidget: all
    run:
      target: SkyScan

  SkyScan-iOS:
    build:
      targets:
        SkyScan-iOS: all
        SkyScanWidget-iOS: all
    run:
      target: SkyScan-iOS
